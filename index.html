<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nubnub · นับนับ</title>
<meta name="theme-color" content="#F8F2E4">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- Header -->
  <header class="app-header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect class="mark-brown" x="18" y="14" width="18" height="92" rx="9"/>
        <rect class="mark-mustard" x="52" y="14" width="18" height="92" rx="9"/>
        <rect class="mark-brown" x="86" y="14" width="18" height="92" rx="9"/>
        <rect class="mark-mustard" x="10" y="52" width="100" height="18" rx="9" transform="rotate(-18 60 61)"/>
      </svg>
      <div class="brand-text">
        <h1>Nubnub</h1>
        <p>นับรายจ่าย นับของใช้ ในที่เดียว</p>
      </div>
    </div>
  </header>

  <!-- ================= PAGE: EXPENSE ================= -->
  <main id="page-expense" class="page is-active">

    <section class="summary-row" aria-label="สรุปยอด">
      <div class="stat-card stat-income">
        <span class="stat-label">รายรับ</span>
        <span class="stat-value" id="sum-income">0</span>
      </div>
      <div class="stat-card stat-expense">
        <span class="stat-label">รายจ่าย</span>
        <span class="stat-value" id="sum-expense">0</span>
      </div>
      <div class="stat-card stat-balance">
        <span class="stat-label">คงเหลือ</span>
        <span class="stat-value" id="sum-balance">0</span>
      </div>
    </section>

    <section class="list-section">
      <div class="list-section-head">
        <h2>รายการล่าสุด</h2>
        <div class="filter-pills" id="tx-filter">
          <button class="pill is-active" data-filter="all">ทั้งหมด</button>
          <button class="pill" data-filter="expense">รายจ่าย</button>
          <button class="pill" data-filter="income">รายรับ</button>
        </div>
      </div>
      <ul class="tx-list" id="tx-list">
        <!-- injected -->
      </ul>
      <p class="empty-state" id="tx-empty" hidden>ยังไม่มีรายการ กดปุ่ม + ด้านล่างเพื่อเริ่มบันทึก</p>
    </section>

  </main>

  <!-- ================= PAGE: INVENTORY ================= -->
  <main id="page-inventory" class="page">

    <section class="list-section">
      <div class="list-section-head">
        <h2>สต็อกของใช้</h2>
        <div class="filter-pills" id="inv-filter">
          <button class="pill is-active" data-filter="all">ทั้งหมด</button>
          <button class="pill" data-filter="low">ใกล้หมด</button>
          <button class="pill" data-filter="out">หมดแล้ว</button>
        </div>
      </div>
      <ul class="inv-list" id="inv-list">
        <!-- injected -->
      </ul>
      <p class="empty-state" id="inv-empty" hidden>ยังไม่มีของในสต็อก กดปุ่ม + เพื่อเพิ่มของชิ้นแรก</p>
    </section>

  </main>

  <!-- Floating add button -->
  <button class="fab" id="fab-add" aria-label="เพิ่มรายการ">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>

  <!-- Bottom tab bar -->
  <nav class="tabbar">
    <button class="tab is-active" data-page="page-expense">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 18V6a2 2 0 012-2h9l5 5v9a2 2 0 01-2 2H6a2 2 0 01-2-2z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 13h6M9 16.5h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M14 4v4a1 1 0 001 1h4" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span>รายจ่าย</span>
    </button>
    <button class="tab" data-page="page-inventory">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 8l8-4 8 4-8 4-8-4z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M4 8v8l8 4 8-4V8" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 12v8" stroke="currentColor" stroke-width="1.7"/></svg>
      <span>สต็อกของใช้</span>
    </button>
  </nav>

</div>

<!-- ================= MODAL: overlay host ================= -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div class="sheet-body" id="sheet-body"><!-- injected form --></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
